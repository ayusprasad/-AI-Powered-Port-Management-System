version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: port-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: port_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  port-app:
    build: .
    container_name: port-management-api
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/port_management
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
