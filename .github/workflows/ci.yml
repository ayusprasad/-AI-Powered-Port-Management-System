name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.11
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -r requirements-dev.txt build
      - name: Lint
        run: ruff check app config tests
      - name: Test
        run: python -m pytest -q
      - name: Build package
        run: python -m build
